[package]
name = "bloom-ai-desktop"
version = "0.1.2"
description = "Bloom AI Desktop: the Sovereign Operating Desk"
authors = ["Bloom AI"]
edition = "2021"

[lib]
name = "bloom_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
